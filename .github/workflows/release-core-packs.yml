name: Release Core resource packs

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (vMAJOR.MINOR.PATCH; existing or new)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.version }}
    steps:
      - name: Check out release branch
        uses: actions/checkout@v5

      - name: Select release revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo 'Run releases from main.' >&2
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Release tags must use vMAJOR.MINOR.PATCH.' >&2
            exit 1
          }
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" > /dev/null; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            git checkout --detach "$RELEASE_TAG"
          else
            echo 'CREATE_TAG=1' >> "$GITHUB_ENV"
          fi

      - name: Package and inspect Core and Vivecraft overlay
        shell: bash
        run: python3 .github/scripts/package_packs.py --output dist --tag "$RELEASE_TAG"

      - name: Create tag for new release
        if: env.CREATE_TAG == '1'
        shell: bash
        run: |
          set -euo pipefail
          git tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/zombies_build_kit-"$RELEASE_TAG".zip \
            dist/zombies_build_kit_vivecraft_overlay-"$RELEASE_TAG".zip \
            --title "Zombies Build Kit $RELEASE_TAG" \
            --generate-notes \
            --verify-tag
