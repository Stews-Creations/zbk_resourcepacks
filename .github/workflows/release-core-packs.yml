name: Release Core resource packs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag (vMAJOR.MINOR.PATCH)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
          persist-credentials: false

      - name: Verify pack versions
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected a version tag such as v1.0.0" >&2
            exit 1
          }
          version="${RELEASE_TAG#v}"
          for pack in zombies_build_kit zombies_build_kit_vivecraft_overlay; do
            test "$(tr -d '\r\n' < "$pack/VERSION")" = "$version" || {
              echo "$pack/VERSION does not match $RELEASE_TAG" >&2
              exit 1
            }
            python3 - "$pack/pack.mcmeta" "$version" <<'PY'
          import json
          import sys

          metadata = json.load(open(sys.argv[1], encoding="utf-8"))
          if metadata["zbk"]["version"] != sys.argv[2]:
              raise SystemExit(f"{sys.argv[1]} version does not match tag")
          PY
          done

      - name: Package Core and Vivecraft overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --output="dist/zombies_build_kit-${RELEASE_TAG}.zip" HEAD:zombies_build_kit
          git archive --format=zip --output="dist/zombies_build_kit_vivecraft_overlay-${RELEASE_TAG}.zip" HEAD:zombies_build_kit_vivecraft_overlay
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archives = sorted(Path("dist").glob("*.zip"))
          if len(archives) != 2:
              raise SystemExit("Release must contain exactly two pack archives")
          for archive in archives:
              with ZipFile(archive) as packaged:
                  names = set(packaged.namelist())
                  if "pack.mcmeta" not in names or "VERSION" not in names:
                      raise SystemExit(f"{archive} has no pack metadata at ZIP root")
                  if not any(name.startswith("assets/zbk/") for name in names):
                      raise SystemExit(f"{archive} has no Core assets")
                  if any("AGENTS.md" in name or "/.codex/" in name for name in names):
                      raise SystemExit(f"{archive} contains local-only files")
                  print(f"{archive}: {len(names)} entries")
          PY

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/zombies_build_kit-"$RELEASE_TAG".zip \
            dist/zombies_build_kit_vivecraft_overlay-"$RELEASE_TAG".zip \
            --title "Zombies Build Kit $RELEASE_TAG" \
            --generate-notes \
            --verify-tag
