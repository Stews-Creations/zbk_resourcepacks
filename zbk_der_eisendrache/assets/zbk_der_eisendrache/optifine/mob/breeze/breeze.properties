# Invisible Breeze variant for Zombies namespace
# Summon with custom name "invisible" to use empty textures

# Default breeze (uses vanilla texture)
skins.1=minecraft:textures/entity/breeze/breeze

# Invisible breeze (empty body and eyes)
skins.2=zombies:textures/entity/breeze/breeze_empty zombies:textures/entity/breeze/breeze_eyes_empty
name.2=pattern:*invisible*
